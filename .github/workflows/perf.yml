name: Performance

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Configure current (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build current
        run: cmake --build build -j$(nproc)
      - name: Checkout baseline
        run: |
          BASE_REF="${GITHUB_BASE_REF:-origin/master}"
          git worktree add /tmp/base "$BASE_REF" || git worktree add /tmp/base "origin/$BASE_REF"
      - name: Configure baseline (Release)
        run: cmake -S /tmp/base -B /tmp/base/build -DCMAKE_BUILD_TYPE=Release
      - name: Build baseline
        run: cmake --build /tmp/base/build -j$(nproc)
      - name: Run benchmarks (current)
        run: |
          cd build
          ./examples/bench --json --iterations 20 --tasks 10000 2>&1 | tee bench_new.json
      - name: Run benchmarks (baseline)
        run: |
          cd /tmp/base/build
          ./examples/bench --json --iterations 20 --tasks 10000 2>&1 | tee bench_base.json
      - name: Compare and gate
        run: |
          python3 tools/bench_compare.py /tmp/base/build/bench_base.json build/bench_new.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            build/bench_new.json
            /tmp/base/build/bench_base.json
          retention-days: 30
