name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake clang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: cd build && ctest --output-on-failure
        timeout-minutes: 10
      - name: Re-run flaky tests on failure
        if: failure()
        run: cd build && ctest --output-on-failure --rerun-failed

  parity-ucontext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang-tools
      - name: Configure (ucontext backend)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLOOMWORKS_CTX_BACKEND=ucontext
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: cd build && ctest --output-on-failure
        timeout-minutes: 10

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [ASan, TSan, UBSan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake
      - name: Configure with ${{ matrix.build_type }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: history_size=7:atomic=ignore_destructor_unloads
        run: |
          cd build
          ctest --output-on-failure
        # ASan/UBSan are hard gates: the library must be leak-clean and
        # free of undefined behaviour (halt_on_error makes UBSan fatal).
        # TSan is best-effort only: the lock-free core (ABA-tagged Treiber
        # stack, Vyukov ring, Chase-Lev deques) is deliberately
        # unsynchronized, and ThreadSanitizer cannot follow the coroutine
        # context switch at all (it crashes in its own interceptors).
        # See docs/risk-assessment.md R19.
        continue-on-error: ${{ matrix.build_type == 'TSan' }}

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake valgrind libc6-dbg || true
          sudo apt-get install -y --fix-missing cmake valgrind || true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Valgrind memcheck
        run: >
          cd build &&
          valgrind --leak-check=full --error-exitcode=1
          --suppressions=${{ github.workspace }}/.github/valgrind.supp
          ./test_thread_pool &&
          valgrind --leak-check=full --error-exitcode=1
          --suppressions=${{ github.workspace }}/.github/valgrind.supp
          ./test_coroutine &&
          valgrind --leak-check=full --error-exitcode=1
          --suppressions=${{ github.workspace }}/.github/valgrind.supp
          ./test_integration
        timeout-minutes: 30

  aarch64-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user cmake
      - name: Configure (aarch64 cross)
        run: cmake -S . -B build -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_BUILD_TYPE=Debug -DENABLE_CLANG_TIDY=OFF -DENABLE_CLANG_FORMAT=OFF
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Run test_coroutine under QEMU
        run: qemu-aarch64 -L /usr/aarch64-linux-gnu ./build/test_coroutine
      - name: Run test_integration under QEMU
        run: qemu-aarch64 -L /usr/aarch64-linux-gnu ./build/test_integration
