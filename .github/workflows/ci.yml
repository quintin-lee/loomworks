name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake clang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: cd build && ctest --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [ASan, TSan, UBSan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake
      - name: Configure with ${{ matrix.build_type }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: |
          cd build
          if [ "${{ matrix.build_type }}" = "TSan" ]; then
            export TSAN_OPTIONS="history_size=7 atomic=ignore_destructor_unloads"
            ctest --output-on-failure || true
          else
            export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/lib${{ matrix.build_type }}.so
            ctest --output-on-failure || true
          fi
        continue-on-error: true

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends cmake valgrind
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Valgrind memcheck
        run: >
          cd build &&
          valgrind --leak-check=full --error-exitcode=1
          ./test_thread_pool &&
          valgrind --leak-check=full --error-exitcode=1
          ./test_coroutine &&
          valgrind --leak-check=full --error-exitcode=1
          ./test_integration
